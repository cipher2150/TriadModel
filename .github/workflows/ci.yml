name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: triad
          POSTGRES_PASSWORD: triad
          POSTGRES_DB: triad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triad -d triad_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://triad:triad@127.0.0.1:5432/triad_test
      REQUIRE_POSTGRES: "1" # Postgres integration tests must run in CI, never skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check backend scripts
      - run: ruff check backend scripts
      - run: mypy
      - run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: backend-coverage
          path: coverage.xml
      - name: Dependency vulnerability scan
        if: matrix.python-version == '3.13'
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: triad
          POSTGRES_PASSWORD: triad
          POSTGRES_DB: triad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triad -d triad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t triadmodel:ci .
      - name: Start the production image
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://triad:triad@127.0.0.1:5432/triad \
            -e PORT=10000 triadmodel:ci
      - name: Wait until ready
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:10000/health/ready && exit 0
            sleep 2
          done
          docker logs app
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Smoke test
        run: python scripts/smoke_test.py http://127.0.0.1:10000
      - name: Container logs on failure
        if: failure()
        run: docker logs app
